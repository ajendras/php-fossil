name: Scheduled PHP Fossil Scan

on:
  schedule:
    - cron: "0 9 * * 1"  # Mondays at 09:00 UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PHP Fossil
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install Nuclei
        run: |
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"

      - name: Prepare targets
        run: |
          cat > targets.txt << EOF
          https://httpbin.org
          http://example.com
          # Add your production and legacy PHP domains here (one per line)
          EOF

      - name: Run PHP Fossil scan
        run: |
          php-fossil scan \
            -f targets.txt \
            --concurrency 5 \
            --timeout 15 \
            --nuclei \
            --html report.html \
            --csv results.csv
        # Note: Ollama is disabled in CI as it requires a running service

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: phpfossil-results
          path: |
            report.html
            results.csv
            phpfossil-results.json
          retention-days: 7
