[build-system]
requires = ["setuptools>=67.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "php-fossil"
version = "0.1.0"
description = "Discovers legacy PHP sites via search dorks, fingerprints old versions, maps vulns, extracts schemas and builds prioritized security lists."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "PHP Fossil Contributors"},
]
keywords = ["php", "security", "vulnerability-scanner", "fingerprinting", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "rich>=13.5.0",
    "pydantic>=2.4.0",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.2",
]

[project.scripts]
php-fossil = "phpfossil.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
phpfossil = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=no"
asyncio_default_fixture_loop_scope = "function"
